<style>

*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}

.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.btn.s{background:#fff;color:var(--acc);border:1px solid var(--acc);margin-top:4px}

.tap{cursor:pointer}.calc{background:#f3f2ee;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.6}

ol,ul{padding-left:20px;margin:6px 0}li{margin-bottom:6px}

<header><b>VYAPARCHECK</b><div><button id="hb">History</button> <button id="ob">Owner view</button></div></header>
<main>
<div id="hist" class="card hist hide"><h2>Records</h2><div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn s" style="margin:0;padding:10px;font-size:14px" id="ex">Excel mein download</button><button class="btn s" style="margin:0;padding:10px;font-size:14px;color:#b91c1c;border-color:#b91c1c" id="da">Sab delete</button></div><div id="hl"></div></div>

<p class="mut" style="margin:8px 0 0">Khaali chhodo to bhi chalega, phir sirf solutions aayenge.</p></div>
<div class="card"><h2>Owner ki problem (jitni lage, tap karo)</h2><div class="chips" id="pb"></div></div>
<div class="card"><h2>Mera note</h2><textarea id="rm" rows="3" placeholder="Jo dekha / suna — dukaan gali ke andar hai, bagal mein D-Mart khula, staff jaldi chhod deta..."></textarea></div>
<button class="btn" type="button" id="go">Checkup karo</button>
</form>
<div id="out"></div>
</main>

const PCT={vis:.15,conv:.1,rep:.1,ops:.05,ppl:.05,comp:.08,season:.1};
const gainOf=(b,s,m,f)=>b==='money'?s*.02+f*.05:s*PCT[b]*m;

const PK={vis:1,conv:0,rep:0,money:1,ops:0,ppl:0,comp:0,season:0};
function sol(b,ty,u){const g=G[b],f=z=>z.replace('%C',T[ty][2]).replace('%U',u?'Udhaar ka rule abhi se: limit + 15 din; sabse purane 5 udhaar walon ko polite reminder + UPI link':'Dukaan ke khaali ghante (jaise dopahar) ke liye alag offer — kharcha wahi, bikri zyada');
const s=TS[ty]&&TS[ty][b];if(!s)return{a:g.a.map(f),w:g.w.map(f),m:g.m.map(f)};
return{a:[s[0],s[1],f(g.a[PK[b]])],w:[s[2],f(g.w[0])],m:g.m.map(f)}}
function effType(d){if(d.ty!=='other'||!d.ot)return d.ty;const h=OM.find(([re])=>re.test(d.ot));return h?h[1]:'other'}


let LD;function run(d,keep){LD=d;const et=effType(d),t=T[et],s=d.sl,f=d.fx,m=d.mg||t[1];
const sc={vis:0,conv:0,rep:0,money:0,ops:0,ppl:0,comp:0,season:0};
d.pb.forEach(k=>{for(const[x,w]of Object.entries(P[k][1]))sc[x]+=w});
K.forEach(([re,x,w])=>{if(re.test(d.rm))sc[x]+=w});
const est=s?s*m-f:null;
if(s&&f&&est<s*.05)sc.money+=2;
let rk=Object.entries(sc).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).map(x=>x[0]);
if(!rk.length)rk=['conv','rep'];if(rk.length<2)rk.push(rk[0]==='conv'?'rep':'conv');
d.top=B[rk[0]][0];const u=d.pb.includes('udh')||/udh?aa?r|baa?ki|credit/i.test(d.rm),top=rk[0],g1=s?gainOf(top,s,m,f):0,g2=s?gainOf(rk[1],s,m,f):0,gain=g1;d.gain=Math.round(g1+g2);
const ask={vis:['Naye customer aapke paas kaise aate hain?','Google pe "near me" search karke dekho — dukaan dikhti hai?'],conv:['Jo bina kharide jaate hain, wo kya maangte the?','Aapka sabse zyada bikne wala item kaunsa hai?'],rep:['Aapke 10 pakke customer kaun hain, aur wo kyun aate hain?','Purane customer ko aakhri baar kab message kiya?'],money:['Sabse zyada kya bikta hai, aur usme kitna bachta hai?','Sabse bada kharcha kaunsa hai?'],ops:['Aap ek din na aao to kya ruk jaata hai?','Maal khatam hone ka pata kaise chalta hai?'],ppl:['Pichla staff kyun chhod ke gaya?','Staff ko salary ke alawa kya milta hai?'],comp:['Customer kis cheez ke liye bolta hai ki online/wahan sasta hai?','Aap kya dete ho jo online wala nahi de sakta?'],season:['Saal ke kaunse mahine sabse khaali jaate hain?','Season wale customers ke number aapke paas hain?']}[top];
let h=`<div class="card"><h2>Checkup · ${esc(d.nm)||'Business'}${d.ar?' · '+esc(d.ar):''}${d.ty==='other'&&d.ot?' · '+esc(d.ot)+(et!=='other'?' (≈ '+T[et][0].split(' /')[0]+')':' (general solutions)'):''}</h2>
${rk.slice(0,3).map((x,i)=>`<span class="tag" style="${i?'opacity:.5':''}">${i?'':'#1 '}${B[x][0]}</span>`).join('')}
<div class="big">${B[top][1]}</div>
${s?`<div class="kpis"><div class="kpi"><small>Mahine ka dhanda</small><b>${R(s)}</b></div><div class="kpi tap" onclick="$('cb').classList.toggle('hide')"><small>Andaazan bachat${f?'':' (kharcha nahi diya)'} ⓘ</small><b style="${est<0?'color:#b91c1c':''}">${R(est)}</b></div></div>
<div id="cb" class="calc hide"><b>Bachat ka hisaab</b><br>
Margin <input id="mgi" type="number" inputmode="decimal" value="${+(m*100).toFixed(1)}" style="width:80px;padding:6px;display:inline-block" onclick="event.stopPropagation()"> % <span class="mut">(${t[0]} ka typical ${Math.round(t[1]*100)}% — owner jo bole wo daalo)</span><br>1. Dhanda ${R(s)} × ${+(m*100).toFixed(1)}% (maal ki keemat nikaal ke ₹100 mein ₹${+(m*100).toFixed(1)} bachte hain) = <b>${R(s*m)}</b><br>
2. Usme se mahine ka fix kharcha ${R(f)} ghatao = <b>${R(est)}</b><br>
<span class="mut">Dhyan rahe: kharche mein maal ki kharid shamil nahi honi chahiye, warna maal do baar katega aur bachat galat (minus mein bhi) aayegi. ${d.mg?'Margin owner ke bataye hisaab se hai.':'Margin typical hai, is dukaan ka asli margin alag ho sakta hai.'}</span></div>`:''}
${s?`<div class="win">Dono plan milake andaazan <b style="color:var(--acc)">+${R(g1+g2)} har mahine</b> = <b>${R((g1+g2)*12)} saal ka</b> extra bachat.<br><span class="mut">Har plan ka hisaab neeche uske card mein tap karke dekho.</span></div>`:''}</div>`;
rk.slice(0,2).forEach((x,i)=>{const o=sol(x,et,u);h+=`<div class="card"><h2>${i?'Saath mein':'Plan'} · ${B[x][0]}</h2>
${s?calcHtml(x,s,m,f,i?g2:g1,'cg'+i):''}<div class="tier">Aaj se (bina kharche)</div><ol>${o.a.map(z=>`<li>${z}</li>`).join('')}</ol>
<div class="tier">Is hafte</div><ol>${o.w.map(z=>`<li>${z}</li>`).join('')}</ol>
${i?'':`<div class="tier">1 mahine mein</div><ol>${o.m.map(z=>`<li>${z}</li>`).join('')}</ol>`}</div>`});
h+=`<div class="card priv${owner?' hide':''}"><h2>Mere notes</h2>
<p><b>Owner se aur poocho (solution ko unki dukaan pe fit karne ke liye):</b></p><ul>${ask.map(z=>`<li>${z}</li>`).join('')}</ul>
<p><b>Jaate waqt:</b></p><ul><li>"2 hafte baad aake dekhta hoon kitna fark pada"</li><li>"Aapke jaan-pehchaan mein koi owner jisko help chahiye?"</li></ul></div>
<button class="btn s" id="cp">Owner ko WhatsApp ke liye copy karo</button>`;
$('out').innerHTML=h;if(keep){$('cb').classList.remove('hide')}else $('out').scrollIntoView({behavior:'smooth'});
const mi=$('mgi');if(mi)mi.onchange=()=>{const v=parseFloat(mi.value);LD.mg=v>0&&v<100?v/100:0;run(LD,1);try{const l=store();if(l[0]&&l[0].t===LD.t){l[0].mg=LD.mg;localStorage.setItem('bizcheck2',JSON.stringify(l))}}catch(e){}};
const o=sol(top,et,u);
const txt=`*VyaparCheck${d.nm?' — '+d.nm:''}*\n\nMain baat: ${B[top][1]}\n${gain?`Mauka: ${LV[top][0]} → +${R(gain)} har mahine\n`:''}\n*Aaj se:*\n${o.a.map((z,i)=>`${i+1}. ${z}`).join('\n')}\n\n*Is hafte:*\n${o.w.map((z,i)=>`${i+1}. ${z}`).join('\n')}\n\n2 hafte baad milke dekhte hain kitna fark pada 👍`;
$('cp').onclick=()=>copy(txt);}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function copy(t){const ok=()=>{$('cp').textContent='Copy ho gaya ✓'};const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function read(){return{nm:$('nm').value.trim(),ar:$('ar').value.trim(),ty:$('ty').value,ot:$('ot').value.trim(),sl:parseFloat($('sl').value)||0,fx:parseFloat($('fx').value)||0,rm:$('rm').value,pb:[...document.querySelectorAll('#pb .chip.on')].map(c=>c.dataset.k)}}
function fill(d){['nm','ar','ty','rm','ot'].forEach(i=>$(i).value=d[i]||'');$('otw').classList.toggle('hide',d.ty!=='other');$('sl').value=d.sl||'';$('fx').value=d.fx||'';document.querySelectorAll('#pb .chip').forEach(c=>c.classList.toggle('on',d.pb.includes(c.dataset.k)))}
function store(){try{return JSON.parse(localStorage.getItem('bizcheck2')||'[]')}catch(e){return[]}}
$('fm').onsubmit=e=>{e.preventDefault();return false};
$('go').onclick=()=>{const d=read();run(d);d.t=new Date().toLocaleString('en-IN');const l=store();l.unshift(d);try{localStorage.setItem('bizcheck2',JSON.stringify(l.slice(0,100)))}catch(e){}};
function save(l){try{localStorage.setItem('bizcheck2',JSON.stringify(l))}catch(e){}}
function showHist(){const l=store();$('hl').innerHTML=l.length?l.map((d,i)=>`<div><span>${esc(d.nm)||'—'} ${d.ar?'· '+esc(d.ar):''}<br><span class="mut">${d.t}</span></span><span style="white-space:nowrap"><button data-i="${i}">Kholo</button> <button data-d="${i}" style="color:#b91c1c">Delete</button></span></div>`).join(''):'<p class="mut">Abhi kuch nahi.</p>';
$('hl').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const d=l[b.dataset.i];fill(d);run(d);$('hist').classList.add('hide')});
$('hl').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.textContent!=='Pakka?'){b.textContent='Pakka?';return}l.splice(b.dataset.d,1);save(l);showHist()})}
$('hb').onclick=()=>{$('hist').classList.toggle('hide');showHist()};
$('da').onclick=()=>{const b=$('da');if(!store().length)return;if(b.textContent!=='Pakka? Sab hat jayega'){b.textContent='Pakka? Sab hat jayega';setTimeout(()=>b.textContent='Sab delete',4000);return}save([]);b.textContent='Sab delete';showHist()};
$('ex').onclick=()=>{const l=store();if(!l.length)return;const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const rows=[['Date','Naam','Area','Type','Business (other)','Mahine ka dhanda','Fix kharcha','Margin %','Problems','Note','Main category','Andaazan fayda/mahina']].concat(l.map(d=>[d.t,d.nm,d.ar,T[d.ty]?T[d.ty][0]:d.ty,d.ot,d.sl||'',d.fx||'',d.mg?Math.round(d.mg*1000)/10:'',(d.pb||[]).map(k=>P[k]?P[k][0]:k).join('; '),d.rm,d.top,d.gain||'']));
const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),fn='vyaparcheck-records.csv';
const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()};
try{const file=new File([csv],fn,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}}catch(e){}dl()};
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
